name: Docker Image Build and Verify (npx-based)  
  
# 手动触发:基于 node:24 构建镜像,镜像内通过 npx @deepseek-ai/dsh  
# 安装依赖并把 `dsh web` 设为默认启动命令,验证服务监听成功后  
# 导出镜像 tar 包作为 7 天保留的 Artifact。  
on:  
  workflow_dispatch: {}  
  
concurrency:  
  group: docker-image-build-and-verify-npx-${{ github.ref }}  
  cancel-in-progress: true  
  
permissions:  
  contents: read  
  
env:  
  IMAGE_NAME: dsh-web  
  IMAGE_TAG: ci  
  CONTAINER_NAME: dsh-web-check  
  
jobs:  
  build-and-verify:  
    name: Build image, start dsh web via npx, verify, and package  
    runs-on: ubuntu-latest  
    timeout-minutes: 30  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v6  
  
      - name: Write Dockerfile  
        run: |  
          {  
            echo 'FROM node:24'  
            echo ''  
            echo 'WORKDIR /app'  
            echo ''  
            echo '# 关闭遥测上报，避免 CI 环境产生外发流量。'  
            echo 'ENV DSH_TELEMETRY_DISABLED=1'  
            echo ''  
            echo '# 预热安装：把 @deepseek-ai/dsh 及其依赖下载/缓存进镜像层，'  
            echo '# 这样容器启动时不需要联网即可直接运行。'  
            echo 'RUN npx --yes @deepseek-ai/dsh --help'  
            echo ''  
            echo 'EXPOSE 3080'  
            echo ''  
            echo '# 默认启动命令：等价于手动运行 `npx @deepseek-ai/dsh web`。'  
            echo 'CMD ["npx", "--yes", "@deepseek-ai/dsh", "web"]'  
          } > Dockerfile  
          cat Dockerfile  
  
      - name: Build image  
        run: docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .  
  
      - name: Start container and verify Web UI is up  
        run: |  
          set -euo pipefail  
          # dsh web 目前只监听 127.0.0.1，必须用 host 网络才能从  
          # runner 上直接探测容器内的端口。  
          docker run -d --network host --name "${CONTAINER_NAME}" "${IMAGE_NAME}:${IMAGE_TAG}"  
  
          success=false  
          for i in $(seq 1 30); do  
            if curl --fail --silent --show-error http://127.0.0.1:3080/ -o /dev/null; then  
              success=true  
              break  
            fi  
            echo "Waiting for dsh web to become available... (${i}/30)"  
            sleep 2  
          done  
  
          if [ "${success}" != true ]; then  
            echo "::error::dsh web did not respond on http://127.0.0.1:3080 within the timeout"  
            docker logs "${CONTAINER_NAME}" || true  
            exit 1  
          fi  
  
          echo "dsh web responded successfully on http://127.0.0.1:3080"  
          docker logs "${CONTAINER_NAME}"  
  
      - name: Stop container  
        if: always()  
        run: docker stop "${CONTAINER_NAME}" || true  
  
      - name: Save image as tarball  
        run: docker save "${IMAGE_NAME}:${IMAGE_TAG}" -o dsh-web-image.tar  
  
      - name: Upload image artifact  
        uses: actions/upload-artifact@v7  
        with:  
          name: dsh-web-image  
          path: dsh-web-image.tar  
          if-no-files-found: error  
          retention-days: 7
