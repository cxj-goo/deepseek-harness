name: Docker Image Build and Verify (offline, externally accessible via nginx)  
  
# Manually triggered: builds a node:24-based image with the project installed  
# and built from source (offline at container start), fronted by an nginx  
# reverse proxy that binds 0.0.0.0 and forwards to dsh web on 127.0.0.1:3080.  
# dsh web itself keeps its default 127.0.0.1 bind (no --host 0.0.0.0, no  
# source patch); external reachability comes from nginx, and the /api  
# browser-trust fence is satisfied via --trusted-host, which is a  
# CLI-supported flag independent of the bind host.  
on:  
  workflow_dispatch: {}  
  
concurrency:  
  group: docker-image-build-and-verify-nginx-${{ github.ref }}  
  cancel-in-progress: true  
  
permissions:  
  contents: read  
  
env:  
  IMAGE_NAME: dsh-web  
  IMAGE_TAG: ci  
  CONTAINER_NAME: dsh-web-check  
  PROXY_PORT: '8080'  
  # The authority remote clients will present as Host when reaching this  
  # deployment (domain name or bare IP, no port — a port-less trustedHosts  
  # entry matches the hostname on any port). Override at `docker run` time  
  # with -e TRUSTED_HOST=<your-domain-or-ip> for your real deployment.  
  VERIFY_TRUSTED_HOST: 'dsh.example.test'  
  
jobs:  
  build-and-verify:  
    name: Build image from source, front it with nginx, verify, and package  
    runs-on: ubuntu-latest  
    timeout-minutes: 60  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v6  
  
      - name: Write .dockerignore  
        run: |  
          {  
            echo '.git'  
            echo 'node_modules'  
            echo '**/node_modules'  
            echo '**/dist'  
            echo '**/lib'  
          } > .dockerignore  
          cat .dockerignore  
  
      - name: Write entrypoint script  
        run: |  
          {  
            echo '#!/bin/bash'  
            echo 'set -e'  
            echo ''  
            echo '# dsh web keeps its default 127.0.0.1 bind (0.0.0.0 is intentionally'  
            echo '# unsupported by the CLI); --trusted-host lets nginx-forwarded requests'  
            echo '# with a non-loopback Host pass the /api browser-trust fence.'  
            echo 'if [ -n "${TRUSTED_HOST:-}" ]; then'  
            echo '  node apps/cli/lib/bin.js web --trusted-host "$TRUSTED_HOST" &'  
            echo 'else'  
            echo '  node apps/cli/lib/bin.js web &'  
            echo 'fi'  
            echo 'DSH_PID=$!'  
            echo ''  
            echo 'nginx -g "daemon off;" &'  
            echo 'NGINX_PID=$!'  
            echo ''  
            echo '# Exit (and let the container restart policy handle it) if either'  
            echo '# process dies, instead of silently running half a stack.'  
            echo 'trap "kill $DSH_PID $NGINX_PID 2>/dev/null || true" TERM INT'  
            echo 'wait -n "$DSH_PID" "$NGINX_PID"'  
            echo 'exit $?'  
          } > entrypoint.sh  
          chmod +x entrypoint.sh  
          cat entrypoint.sh
  
      - name: Write entrypoint script  
        run: |  
          {  
            echo '#!/bin/sh'  
            echo 'set -e'  
            echo ''  
            echo '# dsh web keeps its default 127.0.0.1 bind (0.0.0.0 is intentionally'  
            echo '# unsupported by the CLI); --trusted-host lets nginx-forwarded requests'  
            echo '# with a non-loopback Host pass the /api browser-trust fence.'  
            echo 'if [ -n "${TRUSTED_HOST:-}" ]; then'  
            echo '  node apps/cli/lib/bin.js web --trusted-host "$TRUSTED_HOST" &'  
            echo 'else'  
            echo '  node apps/cli/lib/bin.js web &'  
            echo 'fi'  
            echo 'DSH_PID=$!'  
            echo ''  
            echo 'nginx -g "daemon off;" &'  
            echo 'NGINX_PID=$!'  
            echo ''  
            echo '# Exit (and let the container restart policy handle it) if either'  
            echo '# process dies, instead of silently running half a stack.'  
            echo 'trap "kill $DSH_PID $NGINX_PID 2>/dev/null || true" TERM INT'  
            echo 'wait -n "$DSH_PID" "$NGINX_PID"'  
            echo 'exit $?'  
          } > entrypoint.sh  
          chmod +x entrypoint.sh  
          cat entrypoint.sh  
  
      - name: Write Dockerfile  
        run: |  
          {  
            echo 'FROM node:24'  
            echo ''  
            echo 'WORKDIR /app'  
            echo ''  
            echo '# Bypass the worktree-hooks postinstall guard and disable telemetry'  
            echo '# for automated/offline image builds.'  
            echo 'ENV CI=true'  
            echo 'ENV DSH_TELEMETRY_DISABLED=1'  
            echo ''  
            echo '# packageManager declares pnpm@11.7.0; activate the exact version.'  
            echo 'RUN corepack enable && corepack prepare pnpm@11.7.0 --activate'  
            echo ''  
            echo '# nginx fronts the app: it binds 0.0.0.0, the app keeps 127.0.0.1.'  
            echo 'RUN apt-get update \'  
            echo '    && apt-get install -y --no-install-recommends nginx \'  
            echo '    && rm -rf /var/lib/apt/lists/* /etc/nginx/sites-enabled/default'  
            echo ''  
            echo '# Copy the full monorepo source (pnpm workspace: vendor/*,'  
            echo '# packages/*/*, native/landlock-run(+packages/*), apps/*, website).'  
            echo 'COPY . .'  
            echo ''  
            echo '# Install dependencies once, while the build has network access.'  
            echo 'RUN pnpm install --frozen-lockfile'  
            echo ''  
            echo '# Build host/client libraries and the Web frontend.'  
            echo 'RUN pnpm run build'  
            echo ''  
            echo 'COPY dsh-nginx.conf /etc/nginx/conf.d/dsh.conf'  
            echo 'COPY entrypoint.sh /entrypoint.sh'  
            echo ''  
            echo '# 3080: dsh web'"'"'s own loopback bind (only reachable inside the'  
            echo '# container). 8080: nginx'"'"'s all-interfaces listener — this is the'  
            echo '# port you actually publish with `docker run -p`.'  
            echo 'EXPOSE 3080 8080'  
            echo ''  
            echo 'CMD ["/entrypoint.sh"]'  
          } > Dockerfile  
          cat Dockerfile  
  
      - name: Build image  
        run: docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" .  
  
      - name: Start container with published port and verify Web UI + trust fence  
        run: |  
          set -euo pipefail  
          docker run -d -p "${PROXY_PORT}:${PROXY_PORT}" -e TRUSTED_HOST="${VERIFY_TRUSTED_HOST}" --name "${CONTAINER_NAME}" "${IMAGE_NAME}:${IMAGE_TAG}"  
  
          success=false  
          for i in $(seq 1 30); do  
            if curl --fail --silent --show-error "http://127.0.0.1:${PROXY_PORT}/" -o /dev/null; then  
              success=true  
              break  
            fi  
            echo "Waiting for dsh web (via nginx) to become available... (${i}/30)"  
            sleep 2  
          done  
  
          if [ "${success}" != true ]; then  
            echo "::error::proxied dsh web did not respond on http://127.0.0.1:${PROXY_PORT} within the timeout"  
            docker logs "${CONTAINER_NAME}" || true  
            exit 1  
          fi  
  
          echo "dsh web (behind nginx) responded successfully on http://127.0.0.1:${PROXY_PORT}"  
  
          trusted_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Host: ${VERIFY_TRUSTED_HOST}:${PROXY_PORT}" "http://127.0.0.1:${PROXY_PORT}/api/session.list")"  
          echo "Declared trusted Host -> /api/session.list status: ${trusted_status}"  
          if [ "${trusted_status}" = "403" ]; then  
            echo "::error::declared trusted Host was rejected by the /api fence (got 403)"  
            docker logs "${CONTAINER_NAME}"  
            exit 1  
          fi  
  
          untrusted_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -H "Host: not-declared.example:${PROXY_PORT}" "http://127.0.0.1:${PROXY_PORT}/api/session.list")"  
          echo "Undeclared Host -> /api/session.list status: ${untrusted_status}"  
          if [ "${untrusted_status}" != "403" ]; then  
            echo "::error::an undeclared Host was NOT rejected by the /api fence (expected 403, got ${untrusted_status})"  
            docker logs "${CONTAINER_NAME}"  
            exit 1  
          fi  
  
          docker logs "${CONTAINER_NAME}"
  
      - name: Stop container  
        if: always()  
        run: |  
          docker stop "${CONTAINER_NAME}" || true  
          docker rm "${CONTAINER_NAME}" || true  
  
      - name: Save image as tarball  
        run: docker save "${IMAGE_NAME}:${IMAGE_TAG}" -o dsh-web-image.tar  
  
      - name: Upload image artifact  
        uses: actions/upload-artifact@v7  
        with:  
          name: dsh-web-image  
          path: dsh-web-image.tar  
          if-no-files-found: error  
          retention-days: 7
